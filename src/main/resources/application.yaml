spring:
  application:
    name: gnax-config-server

  security:
    user:
      name: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: master
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true

encrypt:
  key: ${ENCRYPT_KEY}